[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 130
exclude = ["api/models", ".venv-api", "ml-training", "api/vision/product_primitives.py", "api/vision/candidate_primitives.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["api", "workers"]
omit = ["api/models/*", "api/vision/*", "api/main.py"]
